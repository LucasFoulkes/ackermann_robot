cmd_vel_to_effort:
  ros__parameters:
    # --- Geometry (matches urdf/robot.urdf.xacro measurement sheet) ---
    wheelbase: 0.2775          # m, rear axle -> front axle
    # Full steer effort (+/-1.0) = physical full lock = max usable curvature ~1.2 1/m.
    # delta = atan(kappa * L) = atan(1.2 * 0.2775) = 0.3218 rad (18.4 deg).
    # This is the HARD limit (full lock); planner stays inside it (see nav2_params
    # minimum_turning_radius) so the controller keeps tracking margin.
    max_steer_angle: 0.321751  # rad (18.4 deg = curvature 1.2 1/m at full lock)

    # cmd_vel linear.x at this speed -> logical throttle 1.0 (then deadband -> raw PWM)
    # Starting value from field log (~0.86 m/s scale); re-tune with |linear.x| > 0.05 test
    max_speed: 0.85

    apply_deadband: true
    # Raw /ackermann/cmd_effort deadband (PlotJuggler startup test — starting values)
    throttle_deadband_fwd: 0.45   # forward: below this, motion weak/unreliable
    throttle_deadband_rev: 0.55   # reverse
    steer_deadband_pos: 0.55      # data[0] positive (right)
    steer_deadband_neg: 0.60      # data[0] negative (left)

    closed_loop: true    # match drive.launch.py default (yaml said false -> split-brain)
    control_hz: 50.0
    cmd_timeout_s: 0.5
    v_epsilon: 0.02

    # --- Closed-loop PI trims (/odom twist feedback; feedforward stays dominant) ---
    # Speed loop (linear.x -> throttle). closed_loop above enables it.
    vel_kp: 0.3
    vel_ki: 0.3
    vel_trim_max: 0.2
    # Yaw-rate loop (angular.z -> steering, only while |v| > yaw_min_speed).
    # Cancels linkage slop + asymmetric deadband using IMU/odom yaw rate — the
    # only steering feedback we have (no angle sensor on the servo).
    # Tuning: weaving -> halve yaw_kp; pulls harder off-line than before ->
    # sign mismatch, set yaw_kp/yaw_ki to 0.0 and investigate.
    yaw_closed_loop: true
    yaw_kp: 0.4
    yaw_ki: 0.3
    yaw_trim_max: 0.25
    yaw_int_max: 0.3
    yaw_min_speed: 0.10
    # /cmd_vel_to_effort/debug [speed_trim, steer_trim, v_meas, w_meas] @ control_hz
    # for PlotJuggler tuning. Turn off once gains are settled.
    publish_debug: true
