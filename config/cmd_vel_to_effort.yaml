cmd_vel_to_effort:
  ros__parameters:
    # --- Geometry (matches urdf/robot.urdf.xacro measurement sheet) ---
    wheelbase: 0.2775          # m, rear axle -> front axle
    # EFFECTIVE steering model, not mechanical lock. Mechanical full lock is
    # ~18.4 deg (kappa 1.2) but the wheels only get there after 1-2 s of rolling
    # (servo-saver deflection + tire bore torque — dry steering can't reach lock
    # at standstill; 2026-06-11 logs: kappa 0.44 at lock onset -> 0.65 sustained,
    # peak ~0.9). Model the WOUND-IN capability: delta_max = atan(0.8 * L) =
    # 0.2187 rad -> kappa_max 0.8. Gives RPP correction headroom above the
    # planner's R=1.5 m (kappa 0.67) while not promising the static-lock 1.2
    # the car never delivers mid-maneuver. Restore 0.321751 only if a stiffer
    # servo saver / stronger servo closes the wind-in gap.
    max_steer_angle: 0.2187  # rad (effective wound-in lock; kappa_max ~0.8 1/m)

    # cmd_vel linear.x at this speed -> logical throttle 1.0 (then deadband -> raw PWM)
    # 1.0: the 1.9 was an over-correction (set against ICP's rotation-coupling
    # phantom velocity, since clarified). With clean ground truth -- SLAM map
    # gives real ~0.18 m/s at cmd 0.30 / eff 0.56, 2026-06-14 -- 1.9 made the
    # robot crawl (throttle stuck just past the 0.45 deadband). 1.0 puts cmd 0.30
    # at eff ~0.62 -> real ~0.27, i.e. commanded ~= actual, and clears the
    # deadband so the speed loop stops bang-banging. Tune: real << cmd -> lower;
    # real >> cmd -> raise (max_speed = old * real/commanded).
    # 1.9 (was 1.0), paired with deadband_fwd 0.55 — the TWO-THRESHOLD split
    # (2026-07-02 23:20, after the 0.60-deadband drive overshot to 0.75-0.95
    # m/s at cmd 0.25 while STILL stalling 49-75%): breakaway (0.65-0.80,
    # drifts with motor temp) and keep-rolling effort (~0.62 raw -> 0.30 m/s)
    # are DIFFERENT thresholds, and one deadband constant cannot serve both.
    # So: deadband+max_speed map the ROLLING regime only (cmd 0.25 -> raw
    # 0.61 ~= right rolling effort), and the stiction KICK is the designated
    # breakaway bridge (kick_rate/kick_max sized to punch to ~0.8 fast, then
    # bleed once moving). Every platform in docs/platform_survey.md either
    # has ERPM feedback or never solved this; the kick-as-bridge is ours.
    # F/R RECALIBRATION (2026-07-03 18:11 drive): the F/R jumper mode's
    # forward curve is >2x hotter than F/B/R's — raw 0.58-0.62 now gives
    # 0.63 m/s median (2.41 max!), where the same raw gave 0.30 m/s before.
    # New rolling map: deadband 0.53 + max_speed 3.9 puts cmd 0.25 at raw
    # ~0.56 (est. 0.25-0.3 m/s on the new curve, slope ~8 m/s per raw unit).
    # These are FIRST-PASS values from one 61 s session — auto_calib's fresh
    # F/R breakaway data is the tiebreaker for the deadband.
    # 6.0 (was 3.9, 2026-07-04): fresh-battery morning ran 0.69 m/s median
    # on a 0.25 command — the 3.9 map was calibrated on a drained evening
    # pack. Interim policy until M3: map the feedforward for the HOTTEST
    # plant (full battery: cmd 0.25 -> raw ~0.48) so the PI only ever ADDS
    # effort on a sagging pack (+0.35 authority) and never fights overspeed;
    # governor_v backstops the hot side.
    max_speed: 6.0   # stage-swap reverted (wiring unchanged)
    # Reverse re-calibrated on the ESC drivetrain (raw sweep, 2026-07-02
    # 21:09): true threshold is between raw -0.40 (no motion) and -0.50
    # (moves), and at a FIXED raw effort the ESC ACCELERATES continuously
    # (-0.50 held 3 s: 0.2 -> 0.9 m/s) -- reverse is a torque command, not a
    # speed command. So the feedforward only picks the engagement point
    # (cmd -0.2 -> logical 0.1 -> raw ~-0.50 with deadband 0.45) and the
    # speed PI holds the speed by trimming toward/below the threshold.
    # Requires throttle_deadband_rev to be the TRUE threshold (0.45): with the
    # old 0.55 floor the PI physically could not command anything gentler.
    # 2.6 (was 2.0): at 2.0 the cmd -0.3 feedforward landed at raw -0.53 =
    # already pinned at the ceiling, and one 2.5 s stretch still hit 0.55 m/s
    # (21:21 log). 2.6 starts at raw -0.51 and leaves the PI headroom.
    # 4.2 (was 2.6, 2026-07-05): with deadband_rev 0.44, puts cmd -0.30 at
    # raw ~-0.48 — just at the measured rolling sliver instead of -0.52
    # (rocket). The PI trims from there with dithered sub-tick resolution.
    max_speed_rev: 4.2   # stage-swap reverted (wiring unchanged)

    # Hold neutral when commanded direction opposes measured motion (drivetrain
    # needs ~1.3 s to reverse; steering sign was mirrored during 3-point turns).
    direction_interlock: true
    # 0.12 (was 0.05, 2026-07-04 19:26 trace): 0.05 is inside ICP's noise floor
    # — the interlock cut throttle MID-FORWARD-DRIVE on phantom -0.05 readings
    # (3 cuts in one 30 s window, each restarting the breakaway dance). Only
    # real opposing motion should hold the flip.
    interlock_v_stop: 0.12   # m/s, engage new direction below this |odom_v|
    # 2.5 s window after a commanded flip in which the interlock may engage
    # (2026-07-05, 23:57 trace): mid-reverse ICP phantoms (+0.35 "forward"
    # while backing) tripped the un-windowed interlock and cut throttle on
    # 60% of commanded-reverse ticks. Opposing motion is only physically
    # real just after a flip; later it's odometry lying — drive on.
    interlock_window_s: 2.5
    # Cusp dwell (2026-07-04, masterplan T0): after a commanded direction flip
    # (Reeds-Shepp cusp), hold throttle neutral this long while ALREADY
    # publishing the new leg's steering — Reeds-Shepp assumes wheels re-aim
    # while stopped (nav2 #4425), and the servo-saver needs ~1 s under load.
    # Without this, the first meters of every reversal drive on wrong steering.
    # Runs after the interlock (stop first, then aim, then go). 0 disables.
    steer_settle_s: 0.8

    # Stiction kick: breakaway throttle > keep-rolling throttle, and the reverse
    # window is razor thin (raw -0.58 may not move, -0.66 ran away at 0.8 m/s).
    # Ramp extra effort while commanded to move but stationary; bleed it fast
    # once rolling. 2026-06-11 logs: 37% of reverse time stalled without this.
    # Steering hysteresis compensation (loaded linkage is history-dependent:
    # servo saver + tire bore friction; lifted robot centers fine). Backlash
    # inverse overdrives half the slop width in the direction of motion;
    # dither (2% @ 4 Hz) keeps the linkage from settling into stiction.
    # Tune: wheels visibly buzzing -> lower dither_amp; steering still lands
    # short after reversals -> raise steer_backlash by 0.04 steps.
    # OFF (were 0.12 / 0.02): tuned for the pre-mechanical-fix linkage. After the
    # steering was adjusted they over-compensate -- the backlash term pushed
    # near-zero commands THROUGH zero ("steers opposite on straights"), and dither
    # added wander. Re-enable only if hysteresis (history-dependent understeer)
    # returns once the PI is calm; raise backlash in 0.04 steps if so.
    steer_backlash: 0.0
    steer_dither_amp: 0.0
    steer_dither_hz: 4.0

    stiction_kick: true   # breakaway shove from a standstill (drivetrain needs it to start moving)
    # 0.15 (was 0.3) + kick_rate 1.2 (was 0.8), 2026-07-03: PWM-buzz cut. The
    # buzz is the ESC's internal kHz chopping through a motor energized BELOW
    # breakaway — it exists exactly for the kick-ramp window, so shrink it:
    # tile breakaway reached ~0.25 s after go-command, carpet ~0.7 s (was
    # 1-1.5 s of humming per start). Cost: the ramp overshoots breakaway by
    # ~0.11 raw before 10 Hz odom confirms motion -> punchier starts. Too
    # launchy -> kick_rate back toward 0.8 (buzz returns proportionally).
    # Definitive fix is phase 3: seed the kick at the live auto_calib
    # breakaway estimate so sub-breakaway dwell ~= 0.
    kick_delay_s: 0.15   # stationary this long before kicking
    # 0.8 / 0.45 (were 0.4 / 0.35): the kick is now the DESIGNATED breakaway
    # bridge (see max_speed note) — it must reach breakaway-of-the-moment
    # (measured up to 0.80 raw hot) from the rolling feedforward (~0.61 raw)
    # in well under the 2 s watchdog: 0.61 + 0.45*0.45 = 0.81 raw in ~0.6 s.
    # Fast bleed above kick_v_moving keeps the surge short.
    # 0.4 (was 1.2): the fast ramp was sized for buzz reduction on the OLD
    # soft curve; on the hot F/R curve it overshoots breakaway by the full
    # odom-detection lag (~0.15 s x ramp) and every start breaks away AT THE
    # CEILING -> lunge. Slow crossing = breakaway just above true threshold
    # = small overshoot. Costs ~0.5 s more buzz per start; the real cure
    # (IMU-based instant kick release, ~20 ms detection) is queued phase 2.
    kick_rate: 0.4       # logical effort per second of stall
    # 0.85 (was 0.45, 2026-07-02 23:35 drive): CARPET. Stuck episodes up to
    # 10 s with eff_drive pinned at 0.88 = the old kick+ceiling maximum —
    # carpet breakaway is above 0.90 raw, and the motor CAN do it (moves on
    # full manual signal). 0.85 logical (+0.38 raw) lets the kick escalate
    # from the rolling feedforward (~0.61) to the new 1.0 ceiling in ~1.4 s,
    # inside the 2 s watchdog window. Surface-dependent breakaway is the
    # clearest case yet for phase-3 live adaptation. If hard-floor starts
    # get launchy, the kick is bleeding too slow — lower kick_v_moving
    # sensitivity or kick_rate, not this cap.
    # 0.30 (was 0.85): rescaled for the F/R curve + 0.70 ceiling — 0.85 was
    # sized for the old cold curve's carpet breakaway; on the hot curve it
    # IS the lunge. 0.30 logical = +0.14 raw over cruise, reaching the 0.70
    # ceiling. Raise together with raw_throttle_max_fwd if carpet stalls.
    # 0.45 (was 0.30, 2026-07-04 19:26 trace): feedforward(0.37) + 0.30 kick
    # topped out at raw ~0.60 and the robot sat STALLED there for seconds —
    # the kick must be able to reach the 0.70 ceiling on a tired pack.
    # Envelope/governor/watchdog bound the surge after breakaway.
    kick_max: 0.45       # cap (logical units)
    # F/R ESC mode (2026-07-03): kick now fires in REVERSE too — the old
    # forward-only gate guarded against the double-tap misfire, which no
    # longer exists. Reverse authority is bounded by raw_throttle_max_rev.
    kick_reverse: true
    # PHASE-3 LINK #1: forward kicks SEED at auto_calib's live breakaway
    # median (minus kick_seed_lag odom inflation) once n >= kick_seed_min_n
    # events — the kick jumps to just under breakaway-of-the-moment (tracks
    # carpet vs tile, motor temp) instead of ramping through the buzz zone.
    # Set kick_seed_min_n very high to disable seeding.
    kick_seed_min_n: 10.0
    kick_seed_lag: 0.05
    kick_v_moving: 0.05  # m/s, kick bleeds off above this

    # --- Odometry-distrust watchdog (2026-07-02 reverse runaway) ---
    # Lidar ICP couldn't track fast reverse -> odom_v read 0 while the robot
    # backed away; the stiction kick + speed trim piled effort onto a "stalled"
    # robot that was actually accelerating blind. If commanded motion produces
    # no measured motion for watchdog_stall_s (or odom goes stale), hold
    # neutral until the command releases or odom shows motion. A real stall
    # loses nothing (the kick had its window: kick_delay_s + ramp); a blind
    # runaway coasts to a stop. Set false only for odom-less bench teleop.
    odom_watchdog: true
    watchdog_stall_s: 2.0
    watchdog_v_moving: 0.05   # m/s, measured speed that counts as "moving"

    # Hard per-direction ceiling on the RAW throttle out. Feedforward, speed
    # trim and stiction kick each obey their own caps but STACK -- the runaway
    # summed them to raw -0.8 on a -0.2 m/s command.
    # Calibrated from SLAM ground truth, 2026-07-02 20:20 drive: the ESC
    # reverse curve has a CLIFF -- raw -0.61..-0.64 gives 0.22-0.29 m/s
    # (matches cmd), raw -0.69 gives 0.70-0.92 m/s (the "super fast" reverse;
    # both fast bursts were kick-pinned at the old 0.70 cap). 0.63 keeps
    # reverse on the good side of the cliff. Forward at eff ~0.62 measured
    # 0.29-0.31 m/s ~= cmd, so 0.90 stays.
    # 1.0 (was 0.90, 2026-07-02 23:35): the 0.90 ceiling was set from
    # hard-floor SLAM calibration; carpet needs >0.90 to break away and the
    # cap turned every carpet start into a 10 s watchdog-cycling stall.
    # Full forward throttle while STALLED is safe (that's the only time the
    # kick pins it there): the watchdog still bounds blind runaway, the kick
    # bleeds on motion, and the speed PI brakes overspeed.
    # 0.70 (F/R recalibration): on the hot F/R curve raw 0.62 already hit
    # 2.4 m/s and 3.3 m/s^2 launches ("breaks things") — 1.0 is dangerous
    # now. 0.70 still leaves ~0.14 raw of kick headroom over the 0.56
    # cruise. Carpet may need this raised — watch for watchdog-cycling
    # stalls on carpet and raise toward 0.8 first if so.
    raw_throttle_max_fwd: 0.70   # stage-swap reverted
    # 0.55 (was 0.63): the raw sweep showed -0.50 engages and then the ESC
    # self-accelerates; anything deeper only adds torque it doesn't need.
    # 0.53 (2026-07-03 00:00 drive): reverse still reached 0.47 med / 1.08
    # max m/s on ~0.25 m/s commands — the torque-command ESC accelerates
    # faster than the brake-only PI sheds. Narrow the band to [engage -0.50,
    # cap -0.53] so there's less surplus torque to shed. If reverse fails to
    # engage on carpet, this is the first number to raise.
    # 0.51 (F/R mode, 2026-07-03 00:15): still 0.47-1.10 m/s at the 0.53 cap.
    # With engagement ~0.49, cap 0.51 leaves ~1 tick of surplus — reverse
    # should crawl instead of rocket. Carpet reverse may stall; raise first.
    # 0.58 (00:22 drive): 0.51 killed reverse — 82% stall. Reverse has the
    # same two-threshold physics as forward: rolling holds at ~0.49 but
    # STANDSTILL breakaway needs more, and the 0.51 cap gave the kick no
    # headroom. 0.58 = kick headroom for breakaway only (kick bleeds once
    # rolling, PI brakes, watchdog covers blind reverse); the rolling map
    # (deadband_rev 0.46) is unchanged so sustained speed stays regulated.
    # 0.55 (00:31 drive): 0.58 worked (rev stall 27%) but the launch off the
    # kick still peaked 1.07 m/s — by the time 10 Hz odom confirms motion,
    # 0.58 raw has built real speed. 0.55 trades a little stall margin for a
    # gentler launch. The true fix is the pwm_hz resolution bench test.
    # 0.66 (2026-07-04 raw sweep: reverse engages at -0.60 under load in F/R
    # @100Hz — the 0.55/0.58 ceilings were BELOW breakaway, which is why
    # "reverse signal too weak"): 0.60 + kick headroom. Reverse breakaway is
    # now LEARNED (auto_calib rev ring, seeded with the sweep result) and
    # seeds the reverse kick, so this ceiling is a safety cap, not the map.
    # 0.75 (2026-07-04 00:08 run): the learned REV estimate climbed 0.60 ->
    # 0.66 and hit the 0.66 ceiling — a ceiling AT the estimate caps what
    # the learner can ever observe (events can't record above the max
    # allowed effort), so it saturates and reverse under-engages on harder
    # patches. Safety cap now sits above the whole plausibility band
    # (0.45-0.85 est band; watchdog + kick-bleed still bound runaway).
    raw_throttle_max_rev: 0.75   # stage-swap reverted

    apply_deadband: true
    # Raw /ackermann/cmd_effort deadband. fwd 0.60 (was 0.45, H-bridge era):
    # auto_calib measured forward breakaway 0.65 offline (51 events, 13 logs)
    # and 0.69 live (n=17, 2026-07-02 22:19 session), both minus ~0.05 odom
    # lag -> true ~0.60-0.64. At 0.45 the cmd-0.3 feedforward landed at raw
    # 0.615 = AT breakaway: 51% of forward-commanded time stalled, 109 odom-
    # watchdog trips/night, burst-stop-burst motion. 0.60 puts cmd 0.3 at raw
    # 0.72 (clears breakaway); once rolling the speed PI trims down toward the
    # keep-rolling effort (~0.62). If cruise now OVERSPEEDS persistently,
    # lower toward 0.55 before touching the PI.
    # rev re-measured on the ESC via raw sweep 2026-07-02: -0.40 no motion,
    # -0.50 moves. 0.55 was an H-bridge fossil ABOVE the real threshold -- it
    # skipped the gentle zone entirely and pinned every reverse into the fast
    # band.
    # 0.55 (was 0.60 for ~2 drives): 0.60 was calibrated to BREAKAWAY, but
    # this constant is the ROLLING map's intercept — at 0.60 the cmd-0.25
    # feedforward (raw 0.70) overshot to 0.75-0.95 m/s once moving, while
    # breakaway drifted to 0.74-0.80 (hot motor) so it still stalled. 0.55 +
    # max_speed 1.9 puts cruise at raw ~0.61 (the measured 0.30 m/s rolling
    # point); the kick handles breakaway. See the two-threshold note above.
    # 0.46 (was 0.53, 2026-07-03 23:15): the "0.3 m/s rolling floor" was an
    # ARTIFACT — 16 log files contained zero rolling samples below eff 0.53
    # because the feedforward never commanded any; the user drives the same
    # ESC slowly on the transmitter, so the low range exists. Map lowered
    # into it: cmd 0.17 -> raw ~0.48. The speed PI (+/-0.11 raw authority)
    # and the kick bracket the truth from both sides; the ctl_state/vib log
    # columns will show whether the region is live. slow_pulse crawl hack
    # DISABLED — wrong solution (see its note).
    # 0.42 (was 0.46, 2026-07-04): the map's intercept IS the lowest effort
    # it can emit — and on a full 8.4V pack, 0.464 (the old floor) still
    # sustained 0.55 m/s with the envelope pinned flawlessly. The 0.46 was
    # measured on a drained evening pack; the fresh-pack rolling threshold
    # sits lower. 0.42 opens the 0.43-0.46 band for the PI/envelope to find
    # today's true slow point. (This constant is exactly what M3 + the
    # voltage feed should own; every battery state moves it.)
    # 0.34 (was 0.42, 2026-07-04 18:04 trace): the fresh-pack plant RUNS AWAY
    # at the old intercept — raw 0.44-0.47 (the map's minimum for any forward
    # cmd) sustained 0.6-0.8 m/s on a 0.25 command, the PI railed at the
    # logical floor, and the governor's cut-to-zero became the new limit
    # cycle (eff alternates 0.46 <-> 0.00 in the log; goes 0.2 s median).
    # Same quantization disease as the PWM ticks, one level up: the MAP was
    # the wall. 0.34 opens raw 0.35-0.42 so the PI/envelope can reach
    # today's true rolling point; sigma-delta dither gives continuous
    # resolution inside it; a sagged-pack stall in the opened band is the
    # kick+watchdog's job. If stalls dominate on a tired pack, raise toward
    # 0.38 — but M3's live map is the real owner of this number.
    # STAGE-SWAP (2026-07-05, see ackermann_driver.yaml esc_inverted note):
    # motor wires swapped -> forward now runs the ESC's hot 60A stage (the
    # plant reverse had) and reverse the soft 30A stage (the plant forward
    # had). Direction constants swapped accordingly; auto_calib direction
    # rings wiped to relearn. Expect the PI memory to re-converge in the
    # first minute of driving.
    throttle_deadband_fwd: 0.34  # stage-swap reverted 2026-07-05: wiring unchanged
    # 0.46 (was 0.45; F/R-mode drive 2026-07-03 00:15): reverse engagement in
    # the new ESC mode sits between raw 0.467 (stall) and 0.49 (moves at
    # 0.47 m/s!) — a ~0.02-wide band, ~4 PWM ticks at 50 Hz. 0.46 centers
    # low-speed commands INSIDE it (cmd -0.2 -> raw -0.50) so cusp/approach
    # creep engages instead of hanging 8-10 s. Reverse needs a proper F/R
    # raw sweep; these are interim. See also raw_throttle_max_rev.
    # 0.44 (was 0.46, 2026-07-05): open the reverse band below the hot zone
    # — cmd -0.30 mapped to raw -0.52 (~1 m/s^2, terminal >1 m/s; the
    # reverse lunge). Measured sliver: -0.467 stalls, -0.49 rolls. 0.44
    # opens raw -0.44..-0.52 for the dither + PI to search, same move that
    # fixed forward (0.42 -> 0.34).
    throttle_deadband_rev: 0.44  # stage-swap reverted
    steer_deadband_pos: 0.05   # servo is POSITION-proportional (driver maps center + steer*half_range) — 0.55 was mis-measured and quantized steering to >=55% of lock
    steer_deadband_neg: 0.05   # small linkage-slop allowance; yaw PI trims the rest
    # Brief OFF 17:50-18:45 (2026-07-04): the 17:35 drive measured a NON-
    # MONOTONIC transfer on the new servo (mid-range sign flips, full lock ->
    # ~0 curvature) = mechanical fault; the learner pinned R at the 2.5x cap
    # and amplified the chaos. RE-ENABLED after the 18:36 drive measured the
    # transfer monotonic again (linkage fixed): consistent signs all bands,
    # but L/R gain 0.79 vs 0.27 — exactly the asymmetry this learner
    # corrects, and its 300-pair rings refilled on the current hardware
    # today. If the R correction saturates at 2.5 persistently, the right
    # side's 3x weakness is mechanical (servo-saver preload / linkage
    # geometry) and needs a wrench, not a bigger multiplier.
    # FALSE (2026-07-05 01:45, decisive): the linkage is mechanically FINE
    # (user verified repeatedly). The "3x asymmetry" was an ARTIFACT of the
    # gain estimate kappa_odom/eff_steer = (odom_w/odom_v)/eff_steer — with
    # odom_v in the denominator at maneuvering speeds it's noise-dominated:
    # measured gain spread 0.06-1.50 at slow speed for the SAME hardware.
    # Feeding that noise into a steering correction made steering "weird"
    # (random 1.3-2.5x scaling that fights the path). OFF until we have a
    # clean gain measurement (needs active dither at steady speed, M3). The
    # feedforward bicycle model alone steers fine on a good linkage.
    steer_learn: false

    # Pulse-and-coast crawl: DISABLED 2026-07-03 — built on the false "0.3
    # m/s floor" premise (unexplored effort range, not physics). Keep off
    # unless a real measured floor ever reappears after the low-range map.
    slow_pulse: false

    # -0.02 (2026-07-04 11:54 traces): the rolling envelope caps effort at
    # learned-breakaway + this margin. NEGATIVE on purpose — rolling
    # friction < static friction, and the log shows it: effort 0.51 (at
    # breakaway) sustained 0.6+ m/s runaway, while 0.47-0.48 (below
    # breakaway) sustained a perfect 0.25-0.28 cruise. The kick alone may
    # exceed the cap to break static friction; the envelope then holds
    # cruise in the rolling-friction zone. Tracks battery via the learner.
    # -0.04 (was -0.02): on the full pack the rolling band is razor thin —
    # measured 11:57 run: effort 0.47 sustains 0.25 m/s, 0.49 sustains 0.60.
    # Cap at breakaway-0.04 pins cruise to the slow end of the band. If
    # rolling stalls appear (cap under rolling threshold on a sagged pack),
    # raise toward -0.02; the 200 Hz PWM bench test is the real resolution
    # fix for this 2-tick-wide operating band.
    # -0.10 (was -0.04, 2026-07-04 18:04 trace): breakaway reads 0.49-0.50,
    # so the old cap (0.45-0.46 raw) was itself deep in today's runaway zone
    # — the envelope never engaged before the governor chopped. -0.10 pins
    # rolling effort at ~0.39-0.40, inside the fresh-pack rolling band the
    # lowered deadband_fwd just opened. Raise toward -0.04 if rolling stalls
    # appear on a sagged pack (envelope below the rolling threshold).
    # -0.06 (was -0.10): rebalanced for the 0.30 m/s cruise — cap at
    # breakaway(0.47)-0.06 = ~0.41 raw; -0.10's 0.37 cap was below what the
    # higher cruise needs on the evening pack.
    envelope_margin: -0.06

    # 0.50 (was code-default 0.40, 2026-07-04): headroom over the new 0.30
    # cruise — at 0.40 every legitimate 0.35+ transient got chopped to zero.
    # The governor is the last-resort runaway cap, not the cruise regulator.
    governor_v: 0.50
    # Reverse overspeed hysteresis (2026-07-05, 00:23 trace: constant
    # eff -0.51 ran -0.06 -> -1.02 m/s). Corrected physics (ESC docs): both
    # directions are voltage control, but reverse compresses ~50% power into
    # the same range — the speed-holding effort is an ultra-thin sliver and
    # anything past it terminals >= 1 m/s. This band bounds the overshoot
    # (coast above |cmd|+band, drive below) WHILE the per-direction PI +
    # dither converge on the true holding effort; expect the coasting to
    # fade as the reverse integral learns. Widen if cycling feels harsh.
    governor_rev_band: 0.10
    # Reverse pulse-and-coast (2026-07-05 00:39 trace: 1.0 s of engagement
    # effort = REAL -1.2 m/s, and reverse ICP lags ~0.5 s, so every
    # measurement-gated limiter fired 3x too late). Bursts are bounded
    # OPEN-LOOP: drive <= drive_s (~0.3 m/s gained at the measured ~1
    # m/s^2), coast >= coast_s, skip the next burst if the cycle-boundary
    # average is already at target. Average speed ~= drive_s/(drive_s+
    # coast_s) * terminal ~= 0.25-0.35 m/s. Tune drive_s DOWN if reverse
    # still jerks; raise coast_s if it overshoots the target on average.
    # FALLBACK ONLY (2026-07-05 01:0x): try the FORWARD treatment first —
    # open the reverse band + dither + PI memory (below). Flip true if the
    # continuous approach measurably can't hold slow reverse (stiction
    # cliff), which the transmitter test decides: if a human can crawl it
    # backward slowly on the RC radio, a holding effort exists.
    rev_pulse: false
    rev_pulse_drive_s: 0.30
    rev_pulse_coast_s: 0.45

    closed_loop: true    # speed PI (feedforward-dominant trim)
    # 30 Hz (was 50): the dominant cost in this rclpy node is per-tick Python
    # overhead (timer + effort/debug publishes + sub callbacks), not the math.
    # At 0.2 m/s, 30 Hz steering is ample and the driver holds the last command
    # between updates (its own 50 Hz output, 0.5 s timeout). ~40% less CPU here.
    # PI dt and the time-based 4 Hz dither both auto-adjust to the new rate.
    # /cmd_vel_safe since 2026-07-04: commands now pass through
    # nav2_collision_monitor (stop/slowdown safety) before actuation.
    cmd_stamped_topic: "/cmd_vel_safe"
    control_hz: 30.0
    cmd_timeout_s: 0.5
    v_epsilon: 0.02

    # --- Closed-loop PI trims (/odom twist feedback; feedforward stays dominant) ---
    # Speed loop (linear.x -> throttle). closed_loop above enables it.
    # kp 0.6 was too hot: with the deadband-compensation jump (logical 0 -> raw
    # 0.45, nothing between), an aggressive PI kept yanking the throttle ACROSS
    # that jump -> bang-bang surge/stop on straights (eff_drive 0% mid-range,
    # 2026-06-14). Calmed to 0.25 + lower trim cap so feedforward holds a steady
    # throttle and the PI only nudges. The robot CAN cruise slow; the loop just
    # has to stop slamming. (If reverse breakaway returns, fix it with the
    # stiction logic, not a hot kp.)
    vel_kp: 0.25
    vel_ki: 0.3
    # 0.2 (was 0.12): the ESC self-accelerates in reverse, so the PI needs
    # enough downward authority to pull the pulse below the 0.45 threshold
    # and actually shed speed (0.12 logical = only 0.066 raw, not enough).
    # Reverse trim is brake-only, so extra authority can't cause a runaway.
    # 0.35 (was 0.2, 2026-07-04): a fresh-battery morning shifted the ESC
    # curve ~2x hot and the PI railed at 0.2 unable to hold cruise — the
    # trim must be able to absorb battery-state plant shifts until M3
    # (dither-learned gains) replaces the static map. The governor_v hard
    # cap bounds the failure mode of a hot trim.
    vel_trim_max: 0.35
    # Above this measured yaw rate, freeze the speed trim (ICP over-reports
    # linear speed in turns -> PI was cutting throttle to 0 mid-corner).
    speed_trim_yaw_gate: 0.15
    # Yaw-rate loop (angular.z -> steering, only while |v| > yaw_min_speed).
    # Cancels linkage slop + asymmetric deadband using IMU/odom yaw rate — the
    # only steering feedback we have (no angle sensor on the servo).
    # Tuning: weaving -> halve yaw_kp; pulls harder off-line than before ->
    # sign mismatch, set yaw_kp/yaw_ki to 0.0 and investigate.
    yaw_closed_loop: true
    # Calmed back to a feedforward-dominant trim (were kp0.4/ki0.6/trim0.4/int0.5).
    # The hot gains were sized for the OLD linkage's wind-in; after the mechanical
    # steering fix they wound up to ~0.4 chasing odom-yaw noise on straight lines
    # (eff_steer hit -0.79 on a straight). Now the PI only nudges out residual
    # steady-state error; feedforward (steer_log) does the steering. If it
    # understeers persistently in turns, raise yaw_ki toward 0.3.
    # Halved 0.25/0.2 -> 0.12/0.1 (2026-07-02 23:30 drive) per this block's own
    # rule ("weaving -> halve yaw_kp"): steering saturated 34% of moving time
    # and the robot visibly overcorrected. Root cause is partly structural —
    # the yaw PI compares commanded vs measured YAW RATE, so during kick
    # transients (actual v briefly > commanded v) measured w overshoots on a
    # CORRECT curvature and the PI "fixes" steering that isn't wrong, then
    # RPP corrects the resulting path error: weave. Halving damps the loop;
    # the real fix (compare curvature w/v, not w) is queued for phase 2.
    # Restored 0.25/0.2 (2026-07-04, were halved to 0.12/0.1 in the July-2
    # weave era): the weave's causes are gone — speed is controlled (200 Hz
    # band), odometry is clean (1-3% phantom), and the converged per-side
    # feedforward corrections absorb the asymmetry the PI used to fight.
    # What remains is SLOW TRANSIENT wind-in (episodes 1.1 s, steering never
    # arrives) — the PI needs its authority back to drive the linkage in.
    # If straight-line weave returns, halve again and investigate instead.
    yaw_kp: 0.25
    yaw_ki: 0.2
    yaw_trim_max: 0.2
    yaw_int_max: 0.25
    yaw_min_speed: 0.10
    # /cmd_vel_to_effort/debug [speed_trim, steer_trim, v_meas, w_meas] @ control_hz
    # for PlotJuggler tuning. Turn off once gains are settled.
    publish_debug: true
