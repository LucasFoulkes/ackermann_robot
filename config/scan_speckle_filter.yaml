scan_speckle_filter:
  ros__parameters:
    # laser_filters scan_to_scan_filter_chain on the SLAM feed only:
    # /scan_slam_pre (5 Hz, from scan_throttle) -> /scan_slam.
    # Removes isolated returns (reflections, glass edges, passers-by glints)
    # BEFORE they get baked into the slam_toolbox map as permanent freckles.
    # Costmaps keep the raw /scan (DenoiseLayer covers them); ICP odometry
    # keeps raw /scan too — more points help registration.
    filter1:
      name: speckle
      type: laser_filters/LaserScanSpeckleFilter
      params:
        # 0 = Distance mode: a return is kept only if a neighbor within
        # filter_window agrees with it to max_range_difference.
        filter_type: 0
        max_range: 12.0              # match C1 usable range / SLAM max_laser_range
        max_range_difference: 0.25   # lone points >25 cm off both neighbors die
        filter_window: 2
