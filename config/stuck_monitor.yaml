stuck_monitor:
  ros__parameters:
    cmd_topic: "/cmd_vel_nav"
    cmd_fallback_topic: "/cmd_vel"
    odom_topic: "/odom"
    stuck_topic: "/robot_stuck"
    # Nav2 / recovery typically commands >= 0.10 m/s; ignore tiny trims.
    cmd_min_linear: 0.06
    cmd_min_angular: 0.20
    # 0.025 was below grind jitter: the 2026-06-11 wedge produced odom blips up
    # to 0.046 m/s, each resetting the stuck window — 8 s at full throttle with
    # 0.4 cm of motion never counted as stuck and the cancel never fired.
    odom_min_linear: 0.06
    min_displacement_m: 0.04
    stuck_time_s: 2.5
    cmd_grace_s: 0.4
    check_hz: 10.0

    # Escape reflex: after cancel, pulse OPPOSITE to the jammed direction
    # (bump-escape for obstacles below the lidar plane — no sensor sees them,
    # so costmap-based recoveries can't help; the space we came from was free).
    escape_enabled: true
    escape_speed: 0.25     # m/s; stiction kick in the bridge helps break free
    escape_dist: 0.30      # m, stop after this displacement
    escape_timeout_s: 4.0  # give up (wedged both ways) after this long
    escape_delay_s: 0.6    # let the goal cancel propagate first

    # After a successful escape, re-send the canceled goal (cached from
    # /goal_pose — the RViz "Nav2 Goal" tool) so the robot finishes the job
    # instead of sitting freed-but-idle. Bounded so an unreachable goal that
    # jams repeatedly stops after resume_max attempts.
    resume_goal_after_escape: true
    resume_max: 2
