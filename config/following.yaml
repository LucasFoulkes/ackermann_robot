following_server:
  ros__parameters:
    controller_frequency: 20.0      # 50 default is wasted on the Pi at 0.2 m/s
    # 0.6 parked the person 0.3 m from the lidar (mounted 0.24 m ahead
    # of base_link) -- inside its self-return blind ring; they vanished
    desired_distance: 0.9
    detection_timeout: 3.0          # tracker gaps are < 0.6 s when healthy
    static_object_timeout: -1.0     # keep following a person standing still
    linear_tolerance: 0.15
    angular_tolerance: 3.14         # person yaw estimate is noise -- ignore
    skip_orientation: true
    search_by_rotating: false       # Ackermann cannot rotate in place
    max_retries: 100                # person tracking drops are normal, retry
    base_frame: base_link
    fixed_frame: odom
    filter_coef: 0.1
    odom_topic: /odom
    transform_tolerance: 0.3
    controller:
      k_phi: 2.0
      k_delta: 1.0
      v_linear_min: 0.0
      v_linear_max: 0.20
      # 0.22 rad/s at 0.2 m/s ~= R 0.9 m, just inside physical full lock
      # (0.83 m); cmd_vel_to_effort clamps curvature at 1.2 1/m regardless
      v_angular_max: 0.22
      slowdown_radius: 0.5
      # the following server REJECTS collision detection at configure time
      # ("not supported in the following server") -- it froze the whole stack
      # on 2026-06-10. Safety must come from nav2_collision_monitor on the
      # cmd_vel chain instead.
      use_collision_detection: false
