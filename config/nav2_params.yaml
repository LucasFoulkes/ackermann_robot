# Nav2 params tuned for the Ackermann robot (no in-place rotation, min turn radius).
# Global costmap: static SLAM map only (live /scan in map frame caused planner TF errors).
# Dynamic obstacles: local costmap in odom. transform_tolerance moderate for live SLAM.
# First iteration: controller -> /cmd_vel_nav (TwistStamped) -> cmd_vel_to_effort.
# velocity_smoother + collision_monitor intentionally omitted for now (add later;
# when added they MUST go in lifecycle_manager node_names or the cmd pipeline dies).

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 30
    # default_nav_to_pose_bt_xml and default_nav_through_poses_bt_xml are provided
    # by navigation.launch.py so they can use installed package paths. Both custom
    # trees have no Spin recovery.
    # plugin_lib_names intentionally NOT set: Jazzy bt_navigator auto-loads the
    # default BT node library. Re-listing it double-registers BT nodes and can
    # segfault bt_navigator ("ID [ComputePathToPose] already registered").

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    enable_stamped_cmd_vel: true   # publish TwistStamped (matches cmd_vel_to_effort sub)
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # Ride out brief stalls (e.g. RPP collision-ahead) before failing FollowPath.
    failure_tolerance: 2.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    # PoseProgressChecker counts heading change as progress too, so slow Ackermann
    # turns / multi-point maneuvers are not falsely flagged "stuck". Smaller radius
    # + longer allowance make a real stall the only trigger.
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.08
      required_movement_angle: 0.35
      movement_time_allowance: 10.0  # 20 s let real stalls grind too long

    goal_checker:
      plugin: "nav2_controller::PositionGoalChecker"
      xy_goal_tolerance: 0.35

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # RPP has no Ackermann omega cap — keep speed moderate and lookahead long so path
      # corrections stay within the wound-in kappa_max (~0.8 1/m, see
      # cmd_vel_to_effort.yaml; steering takes 1-2 s of rolling to reach lock).
      # cmd_vel_to_effort clamps the rest.
      desired_linear_vel: 0.20
      lookahead_dist: 0.45
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.70
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: true
      # CRITICAL for Ackermann: never try to rotate in place.
      use_rotate_to_heading: false
      allow_reversing: true
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      # Slow down when path curvature approaches the wound-in full-lock radius
      # (matches Smac minimum_turning_radius 1.3).
      regulated_linear_scaling_min_radius: 1.3
      # Keep speed UP in turns: yaw authority is omega = v * kappa, so slowing down in a
      # tight curve removes the yaw rate needed to track it (drive logs 2026-06-11: at
      # odom_v<0.15 only ~30% of requested yaw achieved, 99% steer saturation at the old
      # 0.12 floor; ~63% achieved at 0.30+ m/s). Floor at 0.25 also clears the throttle
      # deadband (~0.19 m/s minimum real speed), so commanded speed is actually obeyed.
      regulated_linear_scaling_min_speed: 0.25
      transform_tolerance: 1.5
      min_approach_linear_velocity: 0.10
      approach_velocity_scaling_dist: 0.6
      # 1.0 (was 1.5): at 0.2 m/s the 1.5 s horizon halted for anything within
      # ~30 cm of the projected path — 1204 collision-ahead halts on 2026-06-11,
      # mostly grazing walls while reversing in the tight zones.
      max_allowed_time_to_collision_up_to_carrot: 1.0
      # If still stuck with "collision ahead" on open path, set false (less safe outdoors).
      use_collision_detection: true

planner_server:
  ros__parameters:
    transform_tolerance: 1.5
    expected_planner_frequency: 1.0   # BT replans at 1 Hz
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.5
      allow_unknown: true
      # DO NOT enable downsample_costmap with a rolling costmap: the
      # downsampler only refreshes its origin when the costmap SIZE changes,
      # and a rolling window never does -- the copy stays at origin (0,0) and
      # every plan fails "Start Coordinates outside bounds" (2026-06-10 run).
      # The 0.1 m rolling window is already 4x fewer cells than the old map.
      downsample_costmap: false
      max_iterations: 200000
      # 0.5 was too tight: ~1 m lateral goals need multi-point Reeds-Shepp
      # maneuvers and timed out as "no valid path found". 1.5 (was 1.0): part of
      # the 25 no-valid-path failures on 2026-06-11 were search exhaustion in
      # tight zones; replans now run at 0.2 Hz so a longer budget is affordable
      # (CPU median ~50% while driving).
      max_planning_time: 1.5
      motion_model_for_search: "REEDS_SHEPP"   # Ackermann with reverse, no spin-in-place
      # Provided by the Kilted 1.4.2 smac overlay in ~/ros2_ws/src/nav2_smac_planner
      # (Jazzy binaries lack it). Goal yaw was never checked anyway
      # (PositionGoalChecker) but DEFAULT mode planned elaborate Reeds-Shepp
      # shunts to hit the goal arrow's heading — ALL_DIRECTION accepts any
      # arrival orientation, kinematically feasible, no realignment dance.
      # BIDIRECTIONAL, not ALL_DIRECTION: 64 acceptable headings made replans
      # flip the cheapest arrival (fwd arc vs reverse arc) on tiny pose changes
      # — cmd direction flapped every 1-2 s on 2026-06-12 13:30 run. Two
      # candidates (arrow heading or its 180) keeps the anti-shunting benefit
      # with a stable choice between replans.
      goal_heading_mode: "BIDIRECTIONAL"
      # ALL_DIRECTION creates one goal per angle bin (64); analytic expansion
      # coarse-checks every 8th, fine-checks the rest near convergence.
      coarse_search_resolution: 8
      # 32 bins broke analytic expansion for short maneuver goals (paired
      # with the 0.5 s budget -> "no valid path found"). 64 is the win vs 72.
      angle_quantization_bins: 64
      # MEASURED steering wind-in (2026-06-11 logs): full lock starts at kappa
      # ~0.44 and winds in to ~0.65 sustained (peak ~0.9) over 1-2 s of rolling —
      # servo-saver deflection + tire bore torque means full lock can't be reached
      # at standstill, only while rolling (classic RC dry-steering behavior).
      # R = 1.5 m matches the SUSTAINED wound-in curvature; the old 1.1 m assumed
      # instant static lock and made every tight arc unfollowable for its first
      # couple of seconds. Re-measure kappa_odom at steer_sat=1 after any
      # servo-saver/tire change.
      # Keep this static while navigating. Live changes make Smac rebuild internal
      # heuristics and can stall the lifecycle heartbeat on the Pi.
      # 1.3: deliberate compromise between the measured sustained wound-in
      # radius (~1.5 m) and plannability — at 1.5 Smac logged 25 "no valid
      # path" in tight zones on 2026-06-11 (R=1.5 arcs don't fit there).
      # Peak wound-in kappa ~0.9 (R~1.1) supports 1.3; the yaw PI covers the gap.
      minimum_turning_radius: 1.3
      # Was 1.0 (user request), but drivetrain takes ~1.3 s to actually change
      # direction (2026-06-11 logs) — rapid Reeds-Shepp cusps thrash. Make
      # reversal legs expensive so plans prefer fewer, longer legs.
      reverse_penalty: 2.0
      # Penalize direction changes in the search: 0.0 made Reeds-Shepp shunts
      # free, so plans realign heading via back-and-forth even in open space
      # (2026-06-11 log: 93 cusps, 55.8 m driven for 2.2 m net). Goal heading
      # isn't even checked (PositionGoalChecker), so cusps buy nothing.
      change_penalty: 0.25
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      analytic_expansion_ratio: 3.5
      smooth_path: true

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true   # recovery behaviors also publish TwistStamped
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # BackUp collision check: only look a short distance ahead (reverse direction).
    simulate_ahead_time: 0.8
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 1.5

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator

local_costmap:
  local_costmap:
    ros__parameters:
      # 10 Hz update (was 5): matches the lidar rate, halves obstacle staleness
      # for RPP's collision checks — CPU headroom measured ~50% median while
      # driving (2026-06-11), and stale marks were feeding collision-ahead halts.
      update_frequency: 10.0
      publish_frequency: 5.0   # 2 Hz made the rolling window visibly trail the robot in RViz
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 2.5
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Planning footprint = URDF outline (base_link = rear axle), wheels included:
      # outer box [[-0.095,-0.152],[-0.095,0.152],[0.363,0.152],[0.363,-0.152]].
      # The old ±0.095 sides left 5.7 cm of wheel UNPROTECTED each side (wheels
      # clipped obstacles the planner thought were clear). Cost: parked ~1 cm
      # from a wall the side may clip inflation again (along-wall stalls) — the
      # recovery tree now backs out first, which is the correct escape for that.
      footprint: "[[-0.09, -0.15], [-0.09, 0.15], [0.36, 0.15], [0.36, -0.15]]"
      plugins: ["lidar_layer", "denoise_layer", "inflation_layer"]
      # Camera removed from LOCAL: depth_floor_scan front arc (±57°) was the dotted
      # perimeter ghost. Global costmap still uses /camera/scan for near low obstacles.
      lidar_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          inf_is_valid: true   # sllidar no-return beams = free space, let them clear
          data_type: "LaserScan"
          # Ignore near-range returns (chassis/legs/cables in base_laser frame).
          raytrace_min_range: 0.22
          raytrace_max_range: 10.0
          obstacle_min_range: 0.22
          obstacle_max_range: 8.0
          observation_persistence: 0.0
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        # Isolated lethal dots (depth noise / stale marks) before inflation greys them.
        minimal_group_size: 3
        group_connectivity_type: 8
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        inflation_radius: 0.10

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 1.5
      # Match local_costmap planning footprint (see comment there): full URDF
      # outline including wheels.
      footprint: "[[-0.09, -0.15], [-0.09, 0.15], [0.36, 0.15], [0.36, -0.15]]"
      resolution: 0.1
      track_unknown_space: true
      # Rolling 12 m window instead of the full SLAM map: Smac cost grows with
      # map area and 2 Hz replanning saturated the Pi.
      rolling_window: true
      width: 12
      height: 12
      # Static SLAM map + LIVE obstacle layers: without them the planner only
      # sees the SLAM map, plans straight through fresh obstacles, and RPP
      # collision-ahead + recoveries loop forever on the same blocked path.
      # (The old "TF into the past" planner stall dates from the 99%-CPU era;
      # TF is healthy since the 2026-06-09 perf overhaul.)
      plugins: ["static_layer", "lidar_layer", "camera_layer", "denoise_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        trinary_costmap: true
      lidar_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          inf_is_valid: true
          data_type: "LaserScan"
          raytrace_min_range: 0.22
          raytrace_max_range: 10.0
          obstacle_min_range: 0.22
          obstacle_max_range: 8.0
      camera_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: camera_scan
        camera_scan:
          topic: /camera/scan
          max_obstacle_height: 0.20
          clearing: true
          marking: true
          inf_is_valid: true
          obstacle_max_range: 1.0   # match depth_floor_scan max_mark_range (near low obs only)
          data_type: "LaserScan"
          raytrace_min_range: 0.15
          raytrace_max_range: 1.5
          obstacle_min_range: 0.15
          observation_persistence: 0.0
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 3
        group_connectivity_type: 8
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Gentle gradient (NOT 40): Smac needs the inflation cost to extend out to the
        # circumscribed radius (~0.394 m) so it can use OPTIMIZED non-circular collision
        # checking. A steep factor collapses cost within ~2 cm -> Smac falls back to full
        # footprint rasterization -> spurious "Start occupied" when a corner clips a wall.
        cost_scaling_factor: 5.0
        # >= circumscribed radius INCLUDING footprint_padding (0.01 default):
        # smac computes 0.4031 m for the full-outline footprint — 0.40 was 3 mm
        # short and silently dropped Smac to slow full-footprint rasterization
        # (3x "Inflation layer not set sufficiently" errors + 100% CPU spikes,
        # 2026-06-11 19:54 run).
        inflation_radius: 0.45
