# Nav2 params tuned for the Ackermann robot (no in-place rotation, min turn radius).
# Global costmap: static SLAM map only (live /scan in map frame caused planner TF errors).
# Dynamic obstacles: local costmap in odom. transform_tolerance moderate for live SLAM.
# First iteration: controller -> /cmd_vel_nav (TwistStamped) -> cmd_vel_to_effort.
# velocity_smoother + collision_monitor intentionally omitted for now (add later;
# when added they MUST go in lifecycle_manager node_names or the cmd pipeline dies).

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 30
    # default_nav_to_pose_bt_xml and default_nav_through_poses_bt_xml are provided
    # by navigation.launch.py so they can use installed package paths. Both custom
    # trees have no Spin recovery.
    # plugin_lib_names intentionally NOT set: Jazzy bt_navigator auto-loads the
    # default BT node library. Re-listing it double-registers BT nodes and can
    # segfault bt_navigator ("ID [ComputePathToPose] already registered").

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    enable_stamped_cmd_vel: true   # publish TwistStamped (matches cmd_vel_to_effort sub)
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # Ride out brief stalls (e.g. RPP collision-ahead) before failing FollowPath.
    failure_tolerance: 2.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    # PoseProgressChecker counts heading change as progress too, so slow Ackermann
    # turns / multi-point maneuvers are not falsely flagged "stuck". Smaller radius
    # + longer allowance make a real stall the only trigger.
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.08
      required_movement_angle: 0.35
      movement_time_allowance: 10.0  # 20 s let real stalls grind too long

    goal_checker:
      plugin: "nav2_controller::PositionGoalChecker"
      xy_goal_tolerance: 0.35
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # RPP has no Ackermann omega cap — keep speed moderate and lookahead long so path
      # corrections stay within kappa_max (~1.2 1/m). cmd_vel_to_effort clamps the rest.
      desired_linear_vel: 0.20
      lookahead_dist: 0.45
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.70
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: true
      # CRITICAL for Ackermann: never try to rotate in place.
      use_rotate_to_heading: false
      allow_reversing: true
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      # Slow down when path curvature approaches physical full lock (R ~ 0.83 m).
      regulated_linear_scaling_min_radius: 1.2
      regulated_linear_scaling_min_speed: 0.12
      transform_tolerance: 1.5
      min_approach_linear_velocity: 0.10
      approach_velocity_scaling_dist: 0.6
      max_allowed_time_to_collision_up_to_carrot: 1.5
      # If still stuck with "collision ahead" on open path, set false (less safe outdoors).
      use_collision_detection: true

planner_server:
  ros__parameters:
    transform_tolerance: 1.5
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 200000
      max_planning_time: 1.5
      motion_model_for_search: "REEDS_SHEPP"   # Ackermann with reverse, no spin-in-place
      angle_quantization_bins: 72
      # Physical full lock = curvature ~1.2 1/m (R~0.83 m), set in cmd_vel_to_effort.
      # Plan wider than that: R = 1.1 m leaves headroom — RPP path corrections often
      # demand tighter turns than the path itself when the robot is off-track.
      # Keep this static while navigating. Live changes make Smac rebuild internal
      # heuristics and can stall the lifecycle heartbeat on the Pi.
      minimum_turning_radius: 1.1
      reverse_penalty: 1.2
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      analytic_expansion_ratio: 3.5
      smooth_path: true

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true   # recovery behaviors also publish TwistStamped
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # BackUp collision check: only look a short distance ahead (reverse direction).
    simulate_ahead_time: 0.8
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 1.5

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0   # 2 Hz made the rolling window visibly trail the robot in RViz
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 2.5
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Planning footprint: slightly smaller than URDF outline (base_link = rear axle).
      # URDF outer box is [[-0.095,-0.152],[-0.095,0.152],[0.363,0.152],[0.363,-0.152]].
      # When parked near a wall, full size + inflation makes the robot look "occupied"
      # in both costmaps even with physical clearance (~5-10 cm). That blocks planning
      # (Start occupied) and makes BackUp fail instantly (Collision Ahead at current pose).
      # Narrower sides (±0.095): when parked parallel to a wall the long edge was
      # clipping inflation even with ~1 cm physical gap (see RViz along-wall stalls).
      footprint: "[[-0.075, -0.095], [-0.075, 0.095], [0.323, 0.095], [0.323, -0.095]]"
      plugins: ["lidar_layer", "camera_layer", "inflation_layer"]
      # Lidar and camera in SEPARATE layers: sharing one layer lets lidar beams
      # that pass OVER a low obstacle raytrace-erase the camera's marks (the
      # lidar can't see below its plane). Layers combine by max; each sensor
      # now clears only its own observations.
      lidar_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          inf_is_valid: true   # sllidar no-return beams = free space, let them clear
          data_type: "LaserScan"
          # Ignore near-range returns (chassis/legs/cables in base_laser frame).
          raytrace_min_range: 0.22
          raytrace_max_range: 10.0
          obstacle_min_range: 0.22
          obstacle_max_range: 8.0
      camera_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: camera_scan
        camera_scan:
          topic: /camera/scan
          max_obstacle_height: 0.20
          clearing: true
          marking: true
          # depth_floor_scan publishes inf for clear beams; without this the
          # obstacle layer DROPS those beams -> camera marks ghosts but never
          # clears them (RPP "collision ahead" freezes on phantom obstacles).
          inf_is_valid: true
          # inf beams become "return at range_max (2.0)" — obstacle_max_range
          # must sit BELOW that or every clear beam marks a phantom ring at
          # exactly 2.0 m around the robot. 1.9: real returns mark, inf clears.
          obstacle_max_range: 1.9
          data_type: "LaserScan"
          # depth_floor_scan: floor -> robot top (~0.195 m); tighter range than lidar.
          raytrace_min_range: 0.15
          raytrace_max_range: 2.2
          obstacle_min_range: 0.15
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        inflation_radius: 0.10

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 1.5
      # Match local_costmap planning footprint (see comment there).
      # Narrower sides (±0.095): when parked parallel to a wall the long edge was
      # clipping inflation even with ~1 cm physical gap (see RViz along-wall stalls).
      footprint: "[[-0.075, -0.095], [-0.075, 0.095], [0.323, 0.095], [0.323, -0.095]]"
      resolution: 0.05
      track_unknown_space: true
      # Static SLAM map + LIVE obstacle layers: without them the planner only
      # sees the SLAM map, plans straight through fresh obstacles, and RPP
      # collision-ahead + recoveries loop forever on the same blocked path.
      # (The old "TF into the past" planner stall dates from the 99%-CPU era;
      # TF is healthy since the 2026-06-09 perf overhaul.)
      plugins: ["static_layer", "lidar_layer", "camera_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        trinary_costmap: true
      lidar_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          inf_is_valid: true
          data_type: "LaserScan"
          raytrace_min_range: 0.22
          raytrace_max_range: 10.0
          obstacle_min_range: 0.22
          obstacle_max_range: 8.0
      camera_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: camera_scan
        camera_scan:
          topic: /camera/scan
          max_obstacle_height: 0.20
          clearing: true
          marking: true
          inf_is_valid: true
          obstacle_max_range: 1.9   # below scan range_max 2.0 (phantom-ring guard)
          data_type: "LaserScan"
          raytrace_min_range: 0.15
          raytrace_max_range: 2.2
          obstacle_min_range: 0.15
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Gentle gradient (NOT 40): Smac needs the inflation cost to extend out to the
        # circumscribed radius (~0.394 m) so it can use OPTIMIZED non-circular collision
        # checking. A steep factor collapses cost within ~2 cm -> Smac falls back to full
        # footprint rasterization -> spurious "Start occupied" when a corner clips a wall.
        cost_scaling_factor: 5.0
        # >= circumscribed radius (~0.337 m for planning footprint). 0.42 was too
        # wide: parked parallel to a wall the side clipped inflated static cells.
        inflation_radius: 0.36
