collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "/cmd_vel_follow"
    cmd_vel_out_topic: "/cmd_vel_follow_safe"
    state_topic: "/collision_monitor_state"
    transform_tolerance: 0.3
    source_timeout: 2.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    # following server publishes unstamped Twist
    enable_stamped_cmd_vel: false
    polygons: ["StopZone", "SlowZone"]
    StopZone:
      type: "polygon"
      # URDF footprint is x [-0.075, 0.323], y [-0.095, 0.095] (base_link =
      # rear axle); stop box = footprint + ~0.10 m bumper ahead + 6 cm sides.
      # Rear margin stays tight: a static "stop" polygon halts the robot for
      # points anywhere inside it regardless of drive direction, so a fat
      # rear zone would freeze forward driving next to a wall behind us.
      points: "[[0.42, 0.16], [0.42, -0.16], [-0.12, -0.16], [-0.12, 0.16]]"
      action_type: "stop"
      min_points: 3
      visualize: true
      polygon_pub_topic: "collision/stop_zone"
      enabled: true
    SlowZone:
      type: "polygon"
      points: "[[0.75, 0.25], [0.75, -0.25], [-0.12, -0.25], [-0.12, 0.25]]"
      action_type: "slowdown"
      slowdown_ratio: 0.5
      min_points: 3
      visualize: true
      polygon_pub_topic: "collision/slow_zone"
      enabled: true
    # lidar only: it is the one sensor every stack always runs. The camera
    # floor scan (/camera/scan_nav) would add <16 cm obstacles, but a stale
    # source makes the monitor fail-safe STOP -- a wedged D435i or a
    # use_floor_scan:=false run would park the robot forever.
    observation_sources: ["scan"]
    scan:
      type: "scan"
      # person-masked: the followed person never triggers stop/slowdown
      topic: "/scan_nav"
      enabled: true
