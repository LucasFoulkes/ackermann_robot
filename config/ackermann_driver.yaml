actuator_driver:
  ros__parameters:
    cmd_topic: "/ackermann/cmd_effort"
    timeout_s: 0.5
    update_hz: 50.0

    i2c_bus: 1
    i2c_address: 64
    pwm_hz: 50.0
    osc_clock_hz: 25000000

    steering_channel: 15
    steering_min_tick: 205
    steering_center_tick: 307
    steering_max_tick: 410
    steering_inverted: false

    # Single servo-style ESC (forward/brake/reverse) on channel 14.
    # Ticks at 50 Hz: 307~=1500us (neutral/stop). Full ESC throw is 205/410
    # (1000/2000us, ~+/-103 ticks). SPEED CAPPED TO 30%: min/max pulled in to
    # neutral +/-31 ticks, so logical throttle +/-1.0 = 30% of physical range.
    # Raise toward 205/410 for more speed; esc_inverted flips fwd/rev.
    esc_channel: 14
    esc_min_tick: 256    # 50% reverse (full = 205)
    esc_neutral_tick: 307
    esc_max_tick: 359    # 50% forward (full = 410)
    esc_inverted: true

    # Neutral dwell held across a forward<->reverse flip (ESC needs the gap so a
    # reverse command isn't read as brake). The cmd_vel_to_effort interlock does
    # the main job; this is the driver-level backstop.
    neutral_hold_ms: 100.0

    # Brake/reverse double-tap (2026-07-02 pulse test: without it, the same
    # ~-0.6 reverse effort engaged 0.3 m/s three times and NOTHING three
    # times -- the ESC read the pulse as brake depending on its internal
    # state). On entering reverse from any non-reverse output: brake tap at
    # the commanded magnitude (tap_ms), neutral gap (tap_gap_ms), then stream
    # reverse. Re-arm (tap again) after the output has been out of reverse
    # for rearm_reset_ms. Adds ~300 ms latency to every reverse engagement.
    esc_double_tap: true
    esc_tap_ms: 150.0
    esc_tap_gap_ms: 150.0
    esc_rearm_reset_ms: 500.0
