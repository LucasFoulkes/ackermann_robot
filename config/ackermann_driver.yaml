actuator_driver:
  ros__parameters:
    cmd_topic: "/ackermann/cmd_effort"
    timeout_s: 0.5
    update_hz: 50.0

    i2c_bus: 1
    i2c_address: 64
    # 100 Hz (was 50, 2026-07-03): PWM RESOLUTION FIX. In F/R mode both
    # drive directions have razor-thin control bands (forward usable band
    # measured ~0.07 logical = ~3-4 ticks at 50 Hz -> only ~4 achievable
    # speeds between stop and 0.6 m/s = "so fast it can't drive"). Doubling
    # the frame rate doubles ticks-per-microsecond: same pulse widths, ~8
    # ticks across each band. ALL tick constants below are 2x their 50 Hz
    # values to keep identical pulse widths (tick = us / (period_us/4096)).
    # If the ESC or servo misbehaves at 100 Hz frames (glitching, hot servo,
    # no arming), revert pwm_hz AND halve all ticks together.
    # 200 Hz (2026-07-04, second doubling): at 100 Hz the fresh-pack forward
    # band had NO commandable value between "doesn't move" and ~0.5 m/s.
    # 200 Hz halves the step inside the band. All ticks are 2x their 100 Hz
    # values (identical pulse widths). BENCH-VALIDATE ESC+servo at 200 Hz
    # before driving; revert pwm_hz AND halve ticks together if either
    # misbehaves. scripts/esc_neutral.py constants updated to match.
    pwm_hz: 200.0
    osc_clock_hz: 25000000
    # Throttle sigma-delta (2026-07-04, masterplan T1 software leg): carries
    # the tick-rounding error into the next 50 Hz update so the AVERAGE pulse
    # width tracks the commanded effort between ticks — the 200 Hz doubling
    # above still left the rolling band only ~4 ticks wide, and quantization
    # limit-cycle theory says uncommandable intermediate speeds = lunges.
    # Bounded to +/-0.5 tick; neutral is never dithered (exact pulse required
    # for the ESC's direction detection); steering is never dithered (buzz).
    # If the ESC audibly stutters at constant commanded effort, set false —
    # that means it can't digest alternating adjacent pulse widths, and the
    # fallback is the Pi 5 RP1 hardware-PWM wire move (masterplan T1 step 2).
    esc_dither: true

    # 12 (was 15, 2026-07-04): channel 15 stopped driving the servo after the
    # I2C bus wedge incident (ESC on ch14 unaffected) — suspected damaged
    # output pin. Servo physically moved to ch12. If ch12 ever dies too,
    # suspect the servo/cable/5V rail instead of the chip.
    steering_channel: 12
    # Endpoints pulled in 20% (2026-07-04, new servo): full ticks (410/820)
    # pushed the linkage PAST its mechanical stop — sustained stall load is
    # what likely killed the previous servo. 450/778 = full command lands
    # just inside the mechanical limit.
    # Ticks computed for the ACTUAL frequency (prescale 30 -> 196.9 Hz, not
    # a clean 200): naive 2x ticks would shift every pulse ~1.5% (neutral
    # +23 us = creep). These preserve the exact pulse widths of the 100 Hz
    # calibration.
    steering_min_tick: 917     # ~1137 us (was 466 @ 100 Hz)
    steering_center_tick: 1210 # 1500 us (was 614)
    steering_max_tick: 1500    # ~1860 us (was 762)
    steering_inverted: false

    # Single servo-style ESC (forward/brake/reverse) on channel 14.
    # Ticks at 100 Hz: 614~=1500us (neutral/stop). Full ESC throw is 410/820
    # (1000/2000us). SPEED CAPPED TO 50%: min/max pulled in to neutral
    # +/-102 ticks. esc_inverted flips fwd/rev.
    esc_channel: 14
    esc_min_tick: 1008   # ~1250 us, 50% reverse (was 512 @ 100 Hz)
    esc_neutral_tick: 1210
    esc_max_tick: 1413   # ~1752 us, 50% forward (was 718)
    # true (2026-07-03, verified by CLEAN single-driver bench test: with
    # false, a forward command moved the robot backward). F/R mode has the
    # SAME polarity sense as the old F/B/R. NOTE: this flag was briefly
    # flipped to false based on drive data that turned out to be poisoned by
    # up to SIX zombie driver instances (mixed old/new configs) writing to
    # the PCA9685 simultaneously — always `pkill -f ackermann_driver` and
    # check `ps` before trusting a bench polarity test.
    # FALSE (2026-07-05 ~01:10, THE STAGE-SWAP FIX): esc_inverted true was
    # compensating reversed motor wiring in software — which physically ran
    # robot-FORWARD on the ESC's weak 30 A reverse stage and robot-REVERSE
    # on the full 60 A forward stage. Measured consequence: reverse ~2.5x
    # hotter per pulse than forward (eff -0.48 -> 1 m/s^2 rocket vs +0.41 ->
    # 0.4 m/s^2), the root of the entire reverse-lunge saga. Fix per the
    # Hobbywing manual: SWAP THE TWO MOTOR WIRES at the ESC, set this false.
    # DO NOT set this true again — if direction is wrong, swap wires.
    # REVERTED to true 2026-07-05 01:2x: user chose to keep current wiring
    # and evaluate by driving. The stage-swap remains the standing offer if
    # reverse on the hot stage stays untamable. This flag matches the
    # PHYSICAL wiring — flip it only together with the wires.
    esc_inverted: true

    # 0.75 (2026-07-05, user experiment; 0.5 was slightly too weak): scale
    # the reverse pulse deviation from neutral to 75% — reverse measured
    # ~2.5x hotter per pulse than forward, so trim its authority at the last
    # point before the chip. REVERSE ONLY (applied where esc_throttle < 0.0);
    # forward output is untouched. Multiplies EVERYTHING reverse: feedforward,
    # kick, PI trim. If reverse is still too fast, lower toward 0.6; if it
    # stops engaging, raise toward 0.85.
    esc_rev_scale: 0.75

    # Neutral dwell held across a forward<->reverse flip (ESC needs the gap so a
    # reverse command isn't read as brake). The cmd_vel_to_effort interlock does
    # the main job; this is the driver-level backstop.
    neutral_hold_ms: 100.0

    # Brake/reverse double-tap (2026-07-02 pulse test: without it, the same
    # ~-0.6 reverse effort engaged 0.3 m/s three times and NOTHING three
    # times -- the ESC read the pulse as brake depending on its internal
    # state). On entering reverse from any non-reverse output: brake tap at
    # the commanded magnitude (tap_ms), neutral gap (tap_gap_ms), then stream
    # reverse. Re-arm (tap again) after the output has been out of reverse
    # for rearm_reset_ms. Adds ~300 ms latency to every reverse engagement.
    # FALSE since 2026-07-03: Mode jumper moved to F/R (single-click reverse,
    # no brake state machine) — reverse pulses act directly, so the tap
    # sequence is now pure latency. NOTE: all reverse calibration (deadband
    # 0.45, engage -0.50, ceiling 0.53, the "cliff") was measured in F/B/R
    # mode; F/R may map reverse throttle differently — re-verify on the
    # first drive and trust auto_calib's REV reports over these comments.
    # If the jumper ever returns to F/B/R, set true again.
    esc_double_tap: false
    esc_tap_ms: 150.0
    esc_tap_gap_ms: 150.0
    esc_rearm_reset_ms: 500.0
