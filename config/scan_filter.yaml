# Shadow/veiling-point removal for the person tracker's scan.
# Points whose incidence angle to their neighbor is near-tangential are
# range-discontinuity artifacts at object edges -- they cluster into fake
# 3-5 point "legs". neighbors kept small so real thin legs survive.
scan_filter:
  ros__parameters:
    filter1:
      name: shadows
      type: laser_filters/ScanShadowsFilter
      params:
        min_angle: 10.0
        max_angle: 170.0
        neighbors: 2
        window: 1
