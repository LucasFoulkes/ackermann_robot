depth_floor_scan:
  ros__parameters:
    # gravity = IMU-leveled base_link z-threshold (default; replaced the RANSAC
    # plane search that was ~42% of a core / the #1 CPU hog, 2026-06-13).
    # Set method: ransac to fall back to the old plane-fit.
    # "ransac" (was "gravity", 2026-07-04): the gravity method ASSUMES a
    # level chassis and broke on every pitch transient / mount shift —
    # three patches of band-aids later it was still marking floor as
    # obstacle. RANSAC measures the actual floor plane per frame (pitch-
    # immune by construction), has its own height/tilt sanity gates, and
    # costs ~9% of one core (benchmarked 2026-06, see ICEBOX) — affordable.
    method: "ransac"
    floor_percentile: 5.0     # low pctile of base_link z taken as floor level
    # Generous sanity band (just catches grossly-bad TF / flipped robot); the
    # exact base_link height above ground is unknown, so don't gate it tight or
    # a valid floor gets rejected and obstacles silently vanish.
    floor_z_min: -0.30
    floor_z_max: 0.15
    cloud_topic: "/camera/camera/depth/color/points"
    scan_topic: "/camera/scan"
    # base_link: stable TF for Nav2 local costmap (odom -> base_link from EKF).
    scan_frame: "base_link"
    process_hz: 8.0
    # --- RANSAC fallback params (unused when method: gravity) ---
    ransac_distance: 0.02
    ransac_iterations: 40
    min_floor_inliers: 600
    max_points: 3500
    # Optical frame: y down, z forward — seed RANSAC on lower/forward points (floor).
    floor_seed_min_y: 0.05
    floor_seed_min_z: 0.20
    # Floor stripped by RANSAC; keep obstacles from floor up to robot top
    # (URDF: body_clearance 0.030 + body_height 0.165 = 0.195 m).
    # 0.065 (was 0.04, 2026-07-02 23:30 drive): with ring suppression fixed the
    # camera actually marks now — and it grabbed floor texture. The gravity
    # floor fit reads 2-3 cm LOW (floor(grav) z=-0.019..-0.027 in the logs;
    # percentile-5 rides the low noise tail), so 0.04-above-estimate was only
    # ~0.015 above TRUE floor. 0.065 puts the true threshold at ~0.04 m, and
    # the 0.06 m wheels climb 2 cm bumps anyway — anything lower than ~4 cm
    # is not an obstacle for this chassis.
    min_obstacle_height: 0.065
    max_obstacle_height: 0.195
    angle_min: -1.0
    angle_max: 1.0
    angle_increment: 0.0075
    range_min: 0.15
    range_max: 1.5   # Nav2 inf->range_max raytrace; was 2.0 = local costmap radius (4 m / 2)
    max_mark_range: 1.0   # low obstacles only; far FOV edge was the front dotted arc
    far_arc_ratio: 0.75   # drop isolated hits beyond 75% of max_mark_range
    far_arc_neighbor_m: 0.12
    # Tightened 0.18/0.30 -> 0.10/0.60 (2026-07-02 23:09 session): the loose
    # thresholds classified REAL obstacles as the noise ring — a wall/box arc
    # at 0.61 m with 0.16 m spread was suppressed every cycle, so the camera
    # contributed nothing to the costmap all session ("robot ignores what the
    # camera sees"). The true D435i artifact is near-constant range across
    # most bins: require spread <= 0.10 AND >= 60% bin coverage before
    # declaring it a ring. If the dotted-perimeter ghost returns, raise
    # coverage back toward 0.4 BEFORE loosening spread.
    ring_spread_max: 0.10
    ring_min_coverage: 0.60
    max_floor_tilt_deg: 20.0
    floor_height_min_m: 0.08
    floor_height_max_m: 0.22
