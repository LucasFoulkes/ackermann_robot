adaptive_ackermann_controller:
  ros__parameters:
    arm_hardware: false
    i2c_bus: 1
    pca9685_address: 64
    pca9685_prescale: 30
    throttle_channel: 14
    steering_channel: 12
    throttle_neutral_us: 1500.0
    steering_center_us: 1463.0
    control_rate_hz: 50.0
    command_timeout_s: 0.50
    odom_timeout_s: 0.50
    scan_timeout_s: 0.50
    obstacle_stop_m: 0.20
    maximum_forward_speed_mps: 0.35
    maximum_reverse_speed_mps: 0.30
    # RPP cruise ceiling. The actuator maximum above remains a hard clamp;
    # publishing it as a Nav2 speed limit previously raised RPP from its
    # configured 0.30 m/s to 0.35 m/s.
    navigation_speed_limit_mps: 0.30
    maximum_measured_speed_mps: 0.55
    # Recorded neutral-stop events gave a 25th-percentile deceleration of
    # 0.453 m/s^2. The 0.10 s reaction term is the C1's typical scan period.
    minimum_braking_deceleration_mps2: 0.45
    sensor_reaction_time_s: 0.10
    # Smallest odd causal window that rejects one isolated TF derivative spike.
    odom_velocity_median_samples: 3
    maximum_curvature_1pm: 1.15
    # Smac uses only this fraction of the learned physical curvature. The
    # remaining authority is reserved for local tracking correction.
    planning_curvature_utilization: 0.80
    # Bootstrap prior, not a permanent minimum. The cusp dispatcher learns
    # trackable curvature separately for forward/reverse and left/right.
    planner_trackability_prior_radius_m: 1.30
    planner_trackability_state_path: "~/.robot/planner_trackability.yaml"
    motion_threshold_mps: 0.025
    breakaway_threshold_mps: 0.045
    # Measured 2026-07-11 (esc_sustain_floor_id): rolling dies below ~0.08
    # m/s both directions, 0.10 crawl is marginal (recoveries). Floor for
    # steering-slowdown and lag evaluation; never command slower than this.
    minimum_sustain_speed_mps: 0.12
    # Zero selects the local slope of the measured direction-specific map.
    throttle_kp_us_per_mps: 0.0
    throttle_ki_us_per_m: 30.0
    # Retained from the successful experiment controller: applied only on
    # fresh odometry and never limits an immediate safety neutral command.
    throttle_rolling_slew_us_per_odom: 6.0
    # Priors are medians of 31 forward and 35 reverse delay-aligned starts from
    # the 11:13 run. They are soft thresholds and update after every launch.
    forward_breakaway_prior_us: 1403.0
    reverse_breakaway_prior_us: 1611.0
    breakaway_forgetting_factor: 0.90
    # Post-breakaway drop lands this much (in speed units, converted via the
    # local map slope) weaker than the sustain pulse while the robust observer
    # confirms motion. Speed units because a fixed 6 us was worth ~2x more
    # speed in reverse (shallow slope) and caused post-launch reverse stalls.
    startup_drop_through_mps: 0.15
    # Low-speed intent is executed as bounded pulse-and-coast, not converted
    # into an indefinitely escalating launch. The active dispatcher segment is
    # authoritative for remaining distance.
    # Normal RPP cusp tracking (0.12--0.14 m/s) remains continuous. The
    # distance trigger is disabled: Nav2's goal checker owns terminal stopping,
    # while the adaptive closed loop owns motion until the checker succeeds.
    # Only a genuinely sub-floor request can select bounded pulse-and-coast.
    gentle_request_max_mps: 0.10
    gentle_segment_length_m: 0.0
    gentle_steering_ready_us: 60.0
    gentle_min_coast_s: 0.35
    gentle_max_pulse_s: 0.45
    gentle_rearm_speed_mps: 0.025
    gentle_launch_max_extra_us: 6.0
    # Stalling within this path distance of a cusp is an intended stop:
    # coast (steering pre-positions for the next segment) instead of the
    # recovery kick; fall back to recovery if the command persists.
    planned_stop_cusp_m: 0.40
    planned_stop_wait_s: 2.0
    # RPP (Jazzy) flip-flops command sign near path inversions while the
    # robot still carries old motion (measured +-+-+ churn; vehicle rock-back
    # measured ZERO by esc_direction_flip_id). Launch/flip only after the
    # commanded sign is stable this long. Deeper fix: Lyrical
    # enforce_path_inversion per masterplan.
    direction_flip_debounce_s: 0.5
    # Stage-2 probe scheduler: +/-8 us alternating steering taps (~2 mm path
    # deviation) during steady straight cruising, >=4 s apart, only with
    # clearance margin and no stop within 1 m. Measure-only: logged as
    # probe_id/probe_offset_us for the stage-3 identification estimators.
    # Disabled for the architecture rollback: no intentional steering changes
    # are permitted after Collision Monitor approves the executable Twist.
    probe_enabled: false
    probe_amplitude_us: 8.0
    probe_duration_s: 0.5
    probe_interval_s: 4.0
    probe_max_curvature_1pm: 0.15
    probe_clearance_margin_m: 0.30
    probe_min_stop_distance_m: 1.0
    maximum_throttle_trim_us: 40.0
    forward_rolling_min_us: 1380.0
    reverse_rolling_max_us: 1640.0
    forward_recovery_limit_us: 1180.0
    reverse_recovery_limit_us: 1820.0
    recovery_step_us: 10.0
    recovery_limit_dwell_samples: 10
    steering_slew_us_per_s: 1000.0
    steering_slowdown_error_us: 30.0
    steering_learning_min_speed_mps: 0.10
    # Continuous identification windows used during ordinary Nav2 goals.
    steering_identification_window_s: 0.55
    steering_identification_min_distance_m: 0.06
    steering_rls_forgetting_factor: 0.995
    steering_rls_min_observations: 12
    steering_rls_full_confidence_observations: 42
    steering_rls_residual_limit_1pm: 0.50
    steering_delay_candidates_s: [0.0, 0.10, 0.20, 0.30, 0.40, 0.50]
    steering_delay_forgetting_factor: 0.98
    steering_delay_min_observations: 12
    # Two-speed steering step experiment 2026-07-11 (steering_step_id, 48
    # steps, hardwood): forward lag is a pure time delay (t50 speed-invariant,
    # d0 CI includes zero); reverse fits lag = 0.168 s + 3.3 cm / v (R2=0.89).
    # Measured through the odometry pipeline, so directly valid for preview.
    # The online delay estimator still runs for telemetry but is not applied.
    steering_lag_time_forward_s: 0.235
    steering_lag_time_reverse_s: 0.168
    steering_lag_distance_forward_m: 0.0
    steering_lag_distance_reverse_m: 0.033
    # MPPI already performs path prediction and inversion handling. The old
    # pure-pursuit preview layer corrupted some MPPI recovery commands.
    apply_path_preview_compensation: false
    # Preserve MPPI recovery steering, but prevent same-sign under-steering of
    # a committed feasible path such as the failed 11:17 reverse cusp.
    apply_path_curvature_floor: false
    path_curvature_floor_max_lateral_error_m: 0.20
    path_curvature_floor_max_heading_error_rad: 0.50
    # Shadow mode: RLS keeps identifying/logging, corrections not applied.
    # The same experiment verified the static maps to a few percent.
    apply_steering_models: false
    vehicle_wheelbase_m: 0.2775
    # A committed Nav2 path remains authoritative until it is replaced. The
    # old 2 s expiry disabled lag preview, cusp semantics, and XTE for 92% of
    # rolling after unconditional replanning was removed. GoalUpdated and
    # IsPathValid in the behavior tree own path replacement/invalidation.
    path_timeout_s: 0.0
    # Must agree with MPPI inversion_xy_tolerance. An opposite-direction
    # command is passed only when the robot is stopped inside this cusp ball.
    path_inversion_tolerance_m: 0.12
    cusp_guard_entry_m: 0.18
    cusp_guard_departure_m: 0.08
    enable_external_path_interpretation: false
    # Same measured transform and rectangle used by Xacro/Nav2.
    lidar_x_m: 0.237
    lidar_y_m: 0.0
    lidar_yaw_rad: 3.141592653589793
    footprint_front_x_m: 0.40
    footprint_rear_x_m: -0.10
    footprint_half_width_m: 0.16
    # Must match the RPP parameters in nav2_odom_experiment.yaml.
    rpp_lookahead_time_s: 1.5
    rpp_min_lookahead_m: 0.30
    rpp_max_lookahead_m: 0.75
    runtime_model_path: "~/.robot/adaptive_ackermann_runtime.yaml"
    drive_log_directory: "~/.robot/drive_logs"
    # Flattened pairs are [speed magnitude m/s, pulse us].
    # Re-measured 2026-07-11 from steering_step_id straight blocks (n=9 per
    # point, sd < 1.2 us, same-session pairs so battery drift cancels).
    # Slopes match the previous 2-point map; domain extended down to ~0.14,
    # halving the extrapolation zone that caused cusp-area stalls. Curvature
    # drag measured ZERO (< 1 tick) at kappa 0.8 — map stays 1-D in speed.
    forward_throttle_map: [0.148, 1419.05, 0.302, 1413.19]
    reverse_throttle_map: [0.138, 1590.34, 0.309, 1594.57]
    # Flattened pairs are [signed curvature 1/m, pulse us]. Direction matters.
    # 2026-07-11 step experiment: pulse 1451.54 measured +0.033 1/m (repeatable
    # forward center bias), so that point is relabeled with its measured
    # curvature; commanding kappa=0 now interpolates to ~1441.6 us.
    forward_steering_map: [-1.35036, 1000.0, -1.34213, 1006.0, -1.24486, 1056.0, -1.07376, 1105.265, -0.90097, 1157.611, -0.76816, 1203.353, -0.60127, 1250.784, -0.46105, 1295.998, -0.26575, 1350.0, -0.13850, 1400.0, 0.033, 1451.54, 0.13025, 1500.0, 0.33769, 1550.0, 0.53052, 1600.0, 0.64433, 1639.480, 0.83220, 1686.952, 0.96921, 1723.868, 1.14126, 1762.484, 1.30429, 1795.475, 1.41142, 1823.087, 1.60169, 1860.388, 1.68716, 1888.448, 1.82852, 1930.539, 1.99345, 1980.559]
    reverse_steering_map: [-1.29043, 1000.0, -1.29259, 1006.0, -1.19128, 1056.0, -1.06766, 1105.265, -0.92624, 1157.611, -0.80051, 1203.353, -0.66064, 1250.784, -0.51885, 1295.998, -0.36080, 1350.0, -0.22125, 1400.0, 0.0, 1475.46, 0.07197, 1500.0, 0.24774, 1550.0, 0.41077, 1600.0, 0.53064, 1639.480, 0.70411, 1686.952, 0.83570, 1723.868, 0.99254, 1762.484, 1.16525, 1795.475, 1.26612, 1823.087, 1.44937, 1860.388, 1.51378, 1888.448, 1.60886, 1930.539, 1.75192, 1980.559]
