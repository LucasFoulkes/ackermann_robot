planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: true
      # A grinding plan must FAIL FAST, never starve the process: with
      # no max_planning_time (Smac default 5.0 s) a single sub-radius
      # goal ground >4 s of iterations, the bond heartbeat starved, and
      # the lifecycle manager executed the ENTIRE nav stack mid-session
      # ('CRITICAL FAILURE: planner_server IS DOWN', 01:23 follow run).
      # 2.0 s stays well under the 4.0 s bond timeout; a plan that
      # cannot be found in 2 s on this Pi is a plan we handle by
      # failing, not by dying.
      max_planning_time: 2.0
      max_iterations: 50000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      lookup_table_size: 10.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 6.0
      # Bootstrap value for direct launches. adaptive_navigation.launch.py
      # replaces it with the persisted four-branch trackability estimate.
      minimum_turning_radius: 1.30  # fallback; launch envelope overrides
      # 1.2 produced squiggle plans: 5-segment maneuvers with 0.27 m
      # micro-legs (2026-07-15 16:14 run), each leg costing a full
      # stop + flip + reverse re-arm + launch (~2-4 s) — the plan
      # optimized distance while the COST of a direction change lives
      # entirely in execution. 1.8 makes each reverse leg earn its
      # keep: prefer driving further on an arc over flipping (user
      # preference, stated). 2.1 (the old value) starved legitimate
      # maneuvers; do not go back there either.
      reverse_penalty: 1.8
      # 0.10 made cusps nearly free: close-quarters plans arrived as
      # COMBS of 11+ sub-0.30 m shuffle fragments (2026-07-16 12:58 —
      # unexecutable, entry-gate rejected, follower starved). 0.35
      # keeps an honest 2-cusp 3-point turn affordable while an
      # 11-cusp comb costs 10x more than the clean alternative.
      change_penalty: 0.35
      # 1.30 backfired (user-caught): Hybrid-A* reads it as 'postpone
      # turning' — straight legs with the whole arc crammed into the
      # last 0.5 m (path |k| 0.19 mid vs 0.47 at ends, 01:31 run).
      # 1.05 distributes curvature along the leg; flip-avoidance stays
      # with reverse_penalty.
      non_straight_penalty: 1.05
      cost_penalty: 2.8   # keep plans farther from obstacles
      retrospective_penalty: 0.015

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.5
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker", "cusp_goal_checker",
                           "follow_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 20.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.30
      stateful: true
    cusp_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # A direction change is not complete merely because the vehicle entered
      # the old broad final-goal ball. Tight cusp completion prevents the next
      # segment from inheriting a large position or steering-state error.
      xy_goal_tolerance: 0.07
      yaw_goal_tolerance: 0.15
      stateful: true
    follow_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # Person-follower maneuvers (route-around / search): the goal is a
      # waypoint near the person, not a docking pose — arrival heading is
      # worthless there and our Smac (1.3.x) predates goal_heading_mode, so
      # heading-freedom is implemented at COMPLETION: yaw tolerance spans
      # every heading and any alignment tail Smac planned never gets driven.
      # Pursuit takes over the moment the person is back in reach, so the
      # position ball is loose too. Selected only by the follower's BT
      # (navigate_to_pose_follow.xml); normal goals keep goal_checker.
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.14
      stateful: true
    FollowPath:
      # RPP produced the certified 0.018 m rolling XTE p90. The FollowPath
      # proxy prevents its Jazzy cusp-pruning defect by sending one direction
      # segment at a time.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.40  # hybrid: era operating point, see adaptive_controller.yaml
      lookahead_dist: 0.35
      # The floor bounds worst-case feedback gain (kappa = 2y/L^2), and the
      # MEASURED closed-loop delay is ~0.40 s (cmd-vs-measured curvature
      # cross-correlation, corr 0.91) — double the 0.20 s the stack
      # compensates. Stability needs L > ~2*v*tau: at the 0.25-0.35 m/s the
      # regulated slowdown parks us at, that is 0.20-0.28 m, so 0.22/0.25
      # snaked, 0.30 stayed marginal (S persisted). 0.36 clears the delay
      # budget across the slow zone; cost = mild chording on crawl arcs.
      # Proper fix queued: feedforward-dominant preview + capped RPP
      # feedback sized to the measured delay.
      min_lookahead_dist: 0.35  # era value; the 0.22-0.36 saga was slew-delay scaffolding
      max_lookahead_dist: 0.75
      # 1.5 -> 1.2 with velocity-scaled CURVATURE lookahead re-enabled below:
      # crawl-speed arcs get 0.22-0.30 m (steer-early, the 118-leg chording
      # fix), cruise gets 0.60-0.75 m (the good era never snaked on
      # straights). One mechanism, both regimes.
      lookahead_time: 1.5  # era value restored: 1.2 was an anti-delay patch
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      # 0.14 sat AT the measured stall floor (~0.12): terminal approaches
      # stall -> recovery pops -> stall again (the residual 'lunges',
      # five stall-recovery stutters in one 2026-07-15 maneuver). 0.18
      # keeps approaches inside the plant's controllable band.
      min_approach_linear_velocity: 0.18
      approach_velocity_scaling_dist: 0.50  # was 0.60->0.35; 0.35 arrived hot at cusps,
      # 0.3-1 m, so 0.60 kept MOST of every 3-point-turn leg in the slowdown zone
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.40  # slow EARLY in curves;
      # fixed on purpose (see launch comment): cornering speed is comfort,
      # not capability. Proven tight-curve speed is ~0.17 m/s.
      # 0.12 was the STRAIGHT-LINE sustain floor; under full steering
      # drag the real floor is higher, so curve regulation was ordering
      # the plant to stall (2026-07-15 18:24 session: 8/8 stalls
      # mid-curve at commanded 0.12-0.13, zero stalls elsewhere). 0.20
      # keeps curves inside the drivetrain's drag-loaded sustain band;
      # cornering stays slow via the 1.40 comfort radius.
      regulated_linear_scaling_min_speed: 0.20
      cost_scaling_dist: 0.30
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      # PATCH REMOVED 2026-07-15: fixed curvature lookahead (0.25, then
      # 0.40) fixed arc chording ('steers too late') but a speed-invariant
      # short lookahead is structurally unstable with our ~0.2 s actuation
      # delay: 10 cm limit-cycle snake on straights, curvature pinned at
      # the clamp 32-57% of straight-line time, no-progress aborts. The
      # velocity-scaled lookahead (lookahead_time 1.2, min 0.22) provides
      # the same steer-early behavior at crawl speeds where chording
      # actually happened, and long stable lookahead at cruise.
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.40
      use_rotate_to_heading: false
      allow_reversing: true
      max_robot_pose_search_dist: 0.75
      use_interpolation: false
      stateful: true

bt_navigator:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 20
    default_server_timeout: 20
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 1.5
    max_rotational_vel: 0.0
    min_rotational_vel: 0.0
    rotational_acc_lim: 0.0

collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_nav
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    # MOLA and costmaps can briefly delay scan processing on this computer.
    # Collision Monitor was alternating STOP/"invalid source" with 0.5 s,
    # chopping continuous commands into tiny movements. The actuator controller
    # retains its independent 0.5 s receipt watchdog, so this larger monitor
    # tolerance does not permit driving with a genuinely stale scan.
    transform_tolerance: 0.5
    source_timeout: 2.0
    stop_pub_timeout: 1.0
    # Select a different stop rectangle from the commanded velocity. Static
    # forward+reverse polygons prevented the robot from driving away from a wall.
    polygons: ["DirectionalStop"]
    DirectionalStop:
      type: "velocity_polygon"
      action_type: "stop"
      min_points: 3
      visualize: true
      polygon_pub_topic: directional_stop
      enabled: true
      holonomic: false
      # Bands must cover the FULL current envelope (cruise 0.50, clamp 0.55,
      # overspeed tripwire 0.75, |kappa| <= 1.30 -> |w| up to ~1.0). A
      # velocity outside every band is NOT collision-checked (the monitor
      # only warns) — the old 0.31/0.36 limits, sized for the retired
      # |v|<=0.30 envelope, silently disabled protection at cruise speed.
      velocity_polygons: ["forward", "forward_fast", "reverse",
                          "reverse_fast", "stopped"]
      forward:
        points: "[[0.42, 0.19], [0.42, -0.19], [0.00, -0.19], [0.00, 0.19]]"
        linear_min: 0.01
        linear_max: 0.31
        theta_min: -0.45
        theta_max: 0.45
      forward_fast:
        # Longer stop rectangle: braking from 0.55-0.75 m/s needs the room.
        points: "[[0.62, 0.19], [0.62, -0.19], [0.00, -0.19], [0.00, 0.19]]"
        linear_min: 0.31
        linear_max: 0.80
        theta_min: -1.0
        theta_max: 1.0
      reverse:
        points: "[[0.00, 0.19], [0.00, -0.19], [-0.17, -0.19], [-0.17, 0.19]]"
        linear_min: -0.31
        linear_max: -0.01
        theta_min: -0.45
        theta_max: 0.45
      reverse_fast:
        points: "[[0.00, 0.19], [0.00, -0.19], [-0.30, -0.19], [-0.30, 0.19]]"
        linear_min: -0.80
        linear_max: -0.31
        theta_min: -1.0
        theta_max: 1.0
      stopped:
        # A nonzero command immediately selects forward or reverse. This small
        # fallback protects the footprint while no directional command exists.
        points: "[[0.20, 0.17], [0.20, -0.17], [-0.12, -0.17], [-0.12, 0.17]]"
        linear_min: -0.01
        linear_max: 0.01
        theta_min: -1.0
        theta_max: 1.0
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: /scan
      enabled: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[-0.10,-0.16],[0.40,-0.16],[0.40,0.16],[-0.10,0.16]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_max_range: 6.0
          raytrace_max_range: 8.0
          # REQUIRED: the per-source default max height is 0.0, which
          # silently discards every lidar point (laser sits ~0.15 m up).
          # Both costmaps ran empty until 2026-07-11 because of this.
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Cost field surrounding the rectangular footprint. This does not
        # replace the rectangle with a circular footprint.
        inflation_radius: 0.55
        cost_scaling_factor: 2.5  # was 4.0: slower decay = near-obstacle
        # driving actually costs something, plans swing wider
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      track_unknown_space: false
      footprint: "[[-0.10,-0.16],[0.40,-0.16],[0.40,0.16],[-0.10,0.16]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_max_range: 6.0
          raytrace_max_range: 8.0
          # REQUIRED: the per-source default max height is 0.0, which
          # silently discards every lidar point (laser sits ~0.15 m up).
          # Both costmaps ran empty until 2026-07-11 because of this.
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Must cover the rectangle's 0.444 m circumscribed radius so Smac can
        # use its optimized footprint collision checks.
        inflation_radius: 0.55
        cost_scaling_factor: 2.5  # was 4.0: slower decay = near-obstacle
        # driving actually costs something, plans swing wider
      always_send_full_costmap: true
