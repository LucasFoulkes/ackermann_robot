planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 100000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      lookup_table_size: 10.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 6.0
      # Bootstrap value for direct launches. adaptive_navigation.launch.py
      # replaces it with the persisted four-branch trackability estimate.
      minimum_turning_radius: 1.30
      reverse_penalty: 2.1
      change_penalty: 0.20
      non_straight_penalty: 1.20
      cost_penalty: 2.0
      retrospective_penalty: 0.015

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.5
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker", "cusp_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 20.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.30
      stateful: true
    cusp_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # A direction change is not complete merely because the vehicle entered
      # the old broad final-goal ball. Tight cusp completion prevents the next
      # segment from inheriting a large position or steering-state error.
      xy_goal_tolerance: 0.07
      yaw_goal_tolerance: 0.15
      stateful: true
    FollowPath:
      # RPP produced the certified 0.018 m rolling XTE p90. The FollowPath
      # proxy prevents its Jazzy cusp-pruning defect by sending one direction
      # segment at a time.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.60
      lookahead_dist: 0.35
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.75
      lookahead_time: 1.5
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.12
      approach_velocity_scaling_dist: 0.60
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.30
      regulated_linear_scaling_min_speed: 0.12
      cost_scaling_dist: 0.30
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.35
      use_rotate_to_heading: false
      allow_reversing: true
      max_robot_pose_search_dist: 0.75
      use_interpolation: false
      stateful: true

bt_navigator:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 20
    default_server_timeout: 20
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 1.5
    max_rotational_vel: 0.0
    min_rotational_vel: 0.0
    rotational_acc_lim: 0.0

collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_nav
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    # MOLA and costmaps can briefly delay scan processing on this computer.
    # Collision Monitor was alternating STOP/"invalid source" with 0.5 s,
    # chopping continuous commands into tiny movements. The actuator controller
    # retains its independent 0.5 s receipt watchdog, so this larger monitor
    # tolerance does not permit driving with a genuinely stale scan.
    transform_tolerance: 0.5
    source_timeout: 2.0
    stop_pub_timeout: 1.0
    # Select a different stop rectangle from the commanded velocity. Static
    # forward+reverse polygons prevented the robot from driving away from a wall.
    polygons: ["DirectionalStop"]
    DirectionalStop:
      type: "velocity_polygon"
      action_type: "stop"
      min_points: 3
      visualize: true
      polygon_pub_topic: directional_stop
      enabled: true
      holonomic: false
      velocity_polygons: ["forward", "reverse", "stopped"]
      forward:
        points: "[[0.42, 0.19], [0.42, -0.19], [0.00, -0.19], [0.00, 0.19]]"
        linear_min: 0.01
        # /cmd_vel_nav has already passed through the adaptive node's
        # Ackermann envelope: |v| <= 0.30 and |w/v| <= 1.15.
        linear_max: 0.31
        theta_min: -0.36
        theta_max: 0.36
      reverse:
        points: "[[0.00, 0.19], [0.00, -0.19], [-0.17, -0.19], [-0.17, 0.19]]"
        linear_min: -0.31
        linear_max: -0.01
        theta_min: -0.36
        theta_max: 0.36
      stopped:
        # A nonzero command immediately selects forward or reverse. This small
        # fallback protects the footprint while no directional command exists.
        points: "[[0.20, 0.17], [0.20, -0.17], [-0.12, -0.17], [-0.12, 0.17]]"
        linear_min: -0.01
        linear_max: 0.01
        theta_min: -1.0
        theta_max: 1.0
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: /scan
      enabled: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[-0.10,-0.16],[0.40,-0.16],[0.40,0.16],[-0.10,0.16]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_max_range: 6.0
          raytrace_max_range: 8.0
          # REQUIRED: the per-source default max height is 0.0, which
          # silently discards every lidar point (laser sits ~0.15 m up).
          # Both costmaps ran empty until 2026-07-11 because of this.
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Cost field surrounding the rectangular footprint. This does not
        # replace the rectangle with a circular footprint.
        inflation_radius: 0.50
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      track_unknown_space: false
      footprint: "[[-0.10,-0.16],[0.40,-0.16],[0.40,0.16],[-0.10,0.16]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_max_range: 6.0
          raytrace_max_range: 8.0
          # REQUIRED: the per-source default max height is 0.0, which
          # silently discards every lidar point (laser sits ~0.15 m up).
          # Both costmaps ran empty until 2026-07-11 because of this.
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Must cover the rectangle's 0.444 m circumscribed radius so Smac can
        # use its optimized footprint collision checks.
        inflation_radius: 0.50
        cost_scaling_factor: 4.0
      always_send_full_costmap: true
